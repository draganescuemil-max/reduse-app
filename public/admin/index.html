<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Reduse App</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 32px; background: #f5f7fb; color: #111827; }
      .card { max-width: 760px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
      h1 { margin-top:0; }
      .status { display: inline-block; padding: 6px 12px; border-radius: 999px; background: #dcfce7; color: #166534; font-weight: 700; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Admin Dashboard</h1>
      <p class="status">Backend online</p>
      <p>Aplicația este gata pentru verificare în Render.</p>
      <p>Endpoint de sănătate: <code>/api/health</code></p>
      <p>Endpoint produse: <code>/api/products</code></p>
    </div>
  </body>
</html>
